<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" role="img" aria-labelledby="title desc"><title id="title">Conceptual virtualized router lab</title><desc id="desc">Illustrative example only. An upstream connection leads to a virtual router, a LAN bridge, and example virtual machines. Actual wiring and interfaces remain unconfirmed.</desc><defs><pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse"><path d="M24 0H0V24" fill="none" stroke="#34383e" stroke-width=".6"/></pattern></defs><rect width="960" height="540" fill="#23262a"/><rect width="960" height="540" fill="url(#grid)"/><g font-family="monospace" fill="#b2bac4"><text x="40" y="47" font-size="13">01 / CONCEPTUAL EXAMPLE</text><text x="40" y="505" font-size="12">ILLUSTRATIVE · REPLACE WITH ACTUAL REDACTED TOPOLOGY</text></g><g stroke="#737d89" stroke-width="2" fill="none"><path d="M190 240H320M500 240H620M710 275V390H480V430M710 390H840V430"/></g><g fill="#2b3036" stroke="#737d89"><rect x="40" y="205" width="150" height="70" rx="4"/><rect x="320" y="185" width="180" height="110" rx="4"/><rect x="620" y="205" width="180" height="70" rx="4"/><rect x="390" y="430" width="180" height="45" rx="4"/><rect x="750" y="430" width="170" height="45" rx="4"/></g><g fill="#d6dde5" text-anchor="middle" font-family="monospace" font-size="16"><text x="115" y="247">Upstream</text><text x="410" y="226">OPNsense VM</text><text x="410" y="252" font-size="12">Inside Proxmox</text><text x="710" y="246">LAN bridge</text><text x="480" y="458">Example VM</text><text x="835" y="458">Example client</text></g><text x="530" y="223" font-family="monospace" font-size="11" fill="#b2bac4">Example</text></svg>